name: Checklist Deadline Reminders Push

on:
  schedule:
    # Every hour, on the hour. Deadlines only have day-level precision
    # (no time picker), so hourly is plenty granular for a 6-hour
    # reminder window — no need to run more often than that.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-checklist-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger checklist reminder check
        run: |
          curl -s -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/push/checklist-reminders"
            