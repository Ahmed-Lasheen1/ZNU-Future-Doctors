name: Supabase Keep Alive

on:
  schedule:
    # Runs at midnight every 3 days
    - cron: '0 0 */3 * *'
  # Allows you to run this manually from the Actions tab if needed
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/?limit=1"
          
