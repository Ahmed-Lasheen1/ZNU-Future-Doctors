<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cache-busted with ?v=2 — browsers cache favicons unusually
         aggressively (often ignoring a normal hard-reload), so simply
         overwriting favicon.svg's content at the same URL isn't
         enough to make an already-visited browser pick up the new
         logo. Bump this query string again next time the favicon
         changes. .ico + sized PNGs are included as fallbacks for
         browsers/OSes that ignore the SVG icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="ZNU Pulse — Your integrated medical study platform: schedules, checklists, question banks, lecture files, and smart summaries for ZNU medical students." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZNU Pulse" />
    <meta property="og:description" content="Your integrated medical study platform for ZNU medical students — schedules, checklists, MCQ bank, files, and summaries in one place." />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZNU Pulse" />
    <meta name="twitter:description" content="Your integrated medical study platform for ZNU medical students." />

    <!-- Display font for the ZNU Pulse Home page (src/pages/Home.jsx /
         premiumTheme.js). Every other page keeps its existing font
         (Segoe UI, set in src/index.css), so this is purely additive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>ZNU Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
