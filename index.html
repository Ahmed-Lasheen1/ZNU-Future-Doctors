<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw all the way under the
         iPhone notch / status bar / home indicator instead of stopping
         short of them — without this, iOS reserves that space and
         fills it with a solid (usually white) bar in standalone PWA
         mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Makes "Add to Home Screen" launch as a standalone app (no
         Safari chrome) and lets the status bar overlay the page
         transparently instead of painting its own solid bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZNU Pulse" />

    <!-- Cache-busted with ?v=2 — browsers cache favicons unusually
         aggressively (often ignoring a normal hard-reload), so bump
         this query string again next time the icon changes. The SVG
         and existing 192px PNG cover modern and legacy PNG consumers
         without referring to non-existent asset files. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="ZNU Pulse — Your integrated medical study platform: schedules, checklists, question banks, lecture files, and smart summaries for ZNU medical students." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZNU Pulse" />
    <meta property="og:description" content="Your integrated medical study platform for ZNU medical students — schedules, checklists, MCQ bank, files, and summaries in one place." />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZNU Pulse" />
    <meta name="twitter:description" content="Your integrated medical study platform for ZNU medical students." />

    <!-- Display font for the ZNU Pulse Home page (src/pages/Home.jsx /
         premiumTheme.js). Every other page keeps its existing font
         (Segoe UI, set in src/index.css), so this is purely additive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>ZNU Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
